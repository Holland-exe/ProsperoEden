name: PE Updater app

# Builds PE Updater, a home screen app for the PS5 that installs the newest ProsperoEden test
# build from the ps5-drop branch:
#   1. tools/pe-updater: the payload that does the work (PS5 Payload SDK v0.42);
#   2. tools/pe-updater/app: the app, built with ps5-native-app-boilerplate, with the payload
#      bundled as /app0/pe-updater.elf;
#   3. PE-Updater.exfat: the app folder in an exFAT image, as ShadowMountPlus wants it (files at
#      the image root, 64 KiB allocation unit, size a multiple of 1 MiB).
# Everything goes on the pe-updater branch: PE-Updater.exfat, pe-updater.elf and SHA256SUMS.
on:
  push:
    branches: [local-build]
    paths:
      - 'tools/pe-updater/**'
      - '.github/workflows/pe-updater.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out ps5-native-app-boilerplate (the commit ProsperoEden pins)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mpereiraesaa/ps5-native-app-boilerplate
          ref: dd44bbdc75437332ed22e3ba95126733419ef25a
          path: bp

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the toolchain and exFAT tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18 make ninja-build ccache pkg-config \
            tar unzip wget exfatprogs
          echo "LLVM_CONFIG=/usr/bin/llvm-config-18" >> "$GITHUB_ENV"

      - name: Fetch the PS5 Payload SDK v0.42
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 -o "$RUNNER_TEMP/sdk.zip" \
            https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip
          echo "8cfbc7cd5811e719eb4f0c47eea668d3dc7b40bc8ab11c4a5031d40c23ec02da  $RUNNER_TEMP/sdk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Build the payload (pe-updater.elf)
        run: |
          set -euo pipefail
          make -C tools/pe-updater PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          python3 tools/validate-loader-elf.py build/pe-updater/pe-updater.elf

      - name: Build the app (PPSA99512)
        env:
          USE_CCACHE: "0"
        run: |
          set -euo pipefail
          mkdir -p bp/peapp bp/build
          cp tools/pe-updater/app/main.cpp tools/pe-updater/app/demo_renderer.cpp \
             tools/pe-updater/app/demo_renderer.hpp tools/pe-updater/app/param.json bp/peapp/
          cp build/pe-updater/pe-updater.elf bp/build/pe-updater.elf
          cd bp
          make app BUILD_JOBS="$(nproc)" APP_SOURCE_DIR=peapp APP_PARAM=peapp/param.json \
            APP_SCE_SYS=sce_sys APP_ASSETS= APP_ROOT_FILES=build/pe-updater.elf
          test -f dist/PPSA99512/eboot.bin
          test -f dist/PPSA99512/sce_sys/param.json
          test -f dist/PPSA99512/pe-updater.elf
          find dist/PPSA99512 -type f | sort

      - name: Pack PE-Updater.exfat
        run: |
          set -euo pipefail
          app=bp/dist/PPSA99512
          content=$(du -sb "$app" | cut -f1)
          # Room for the filesystem's own structures, rounded up to whole MiB.
          size=$(( ((content + 16*1024*1024) / 1048576 + 1) * 1048576 ))
          truncate -s "$size" PE-Updater.exfat
          mkfs.exfat -c 64K -L PEUPDATER PE-Updater.exfat
          mkdir mnt
          sudo mount -o loop,uid="$(id -u)",gid="$(id -g)" PE-Updater.exfat mnt
          # The app's files at the image root, with no folder around them.
          cp -r "$app"/. mnt/
          sync
          ls -la mnt mnt/sce_sys
          sudo umount mnt
          ls -la PE-Updater.exfat

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pe-updater
          path: |
            PE-Updater.exfat
            build/pe-updater/pe-updater.elf
          retention-days: 30

      - name: Push to the pe-updater branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir drop
          cp PE-Updater.exfat build/pe-updater/pe-updater.elf drop/
          cd drop
          sha256sum PE-Updater.exfat pe-updater.elf > SHA256SUMS
          git init -q -b pe-updater
          git add -A
          git -c user.name=pe-updater -c user.email=pe-updater@users.noreply.github.com \
            commit -qm "PE Updater ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pe-updater
